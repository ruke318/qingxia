<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>示例便笺</title>
    <style>
      /* 颜色引用宿主注入的主题变量（var(--qb-*)），宿主调整外观时插件无需改动；深色覆盖在宿主主题支持深色前暂由插件自备 */
      :root { --text: var(--qb-text); --muted: var(--qb-text-secondary); --line: var(--qb-hover); --error: var(--qb-danger); }
      :root[data-theme="dark"] { color-scheme: dark; --text: #e4e8ee; --muted: #9aa4b1; --line: rgba(255, 255, 255, .14); --error: #ff7b6b; }
      html, body { height: 100%; margin: 0; background: transparent; }
      body { font-size: 14px; line-height: 1.5; color: var(--text); }
      main { height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; padding: 16px; }
      textarea { flex: 1; resize: none; border: 0; outline: none; background: transparent; color: inherit; font: inherit; }
      footer { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 12px; }
      #status.error { color: var(--error); }
      button { border: 0; border-radius: 8px; padding: 4px 12px; background: var(--line); color: inherit; font: inherit; }
    </style>
  </head>
  <body>
    <main>
      <textarea id="note" aria-label="便笺内容" placeholder="写点什么，⌘S 保存，Esc 返回"></textarea>
      <footer>
        <span id="status" role="status">正在连接轻匣…</span>
        <button id="save" type="button">保存</button>
      </footer>
    </main>
    <!-- 插件 CSP 禁止内联脚本，脚本必须是包内文件并使用相对路径 -->
    <script src="main.js"></script>
  </body>
</html>
