<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><link rel="icon" href="data:,"><link rel="stylesheet" href="/src/styles.css"><title>快捷键设置回归检查</title></head>
<body style="margin:0;width:720px">
  <div id="root"></div>
  <script type="module">
    // 模拟宿主：命令调用与事件监听都经 __TAURI_INTERNALS__，不连接真实应用
    const row = (id, group, title, extra = {}) => ({ id, group, title, scope: "global", defaultValue: null, suggested: null, saved: null, active: null, enabled: true, error: null, ...extra });
    let rows = [
      row("launcher", "轻匣", "唤起轻匣", { defaultValue: "Alt+Space", saved: "Alt+Space", active: "Alt+Space" }),
      row("fullscreen", "轻匣", "插件全屏", { scope: "panel", defaultValue: "Super+Control+F", saved: "Super+Shift+F", active: "Super+Shift+F" }),
      row("screenshot", "轻匣", "截图", { saved: "Super+Shift+X", active: "Super+Shift+X", suggested: "Alt+Shift+A" }),
      row("recording", "轻匣", "录屏", { saved: "Super+Shift+R", active: "Super+Shift+R", suggested: "Alt+Shift+R" }),
      // 旧版本保存的非规范写法，用来检查组合与顺序无关
      row("clipboard-history:open", "剪贴板", "剪贴板", { suggested: "Alt+Shift+V", saved: "Shift+Alt+V", active: "Shift+Alt+V" }),
      row("json-tools:open", "格式化编辑器", "格式化编辑器", { suggested: "Alt+J" }),
      row("crypto-tools:encode", "编码工具", "编码 / 解码"),
      row("crypto-tools:hash", "编码工具", "哈希", { saved: "Super+Alt+H", error: "快捷键注册失败，可能已被系统或其他应用占用" }),
      row("qr-tools:open", "二维码", "二维码", { saved: "Alt+Q", enabled: false }),
    ];
    const calls = [];
    const callbacks = new Map();
    const listeners = new Map();
    let nextCallback = 1;
    let failSave = null;
    const copy = () => JSON.parse(JSON.stringify(rows));
    globalThis.isTauri = true;
    window.__TAURI_EVENT_PLUGIN_INTERNALS__ = { unregisterListener() {} };
    window.__TAURI_INTERNALS__ = {
      transformCallback(callback) { const id = nextCallback++; callbacks.set(id, callback); return id; },
      invoke(command, args) {
        calls.push({ command, args });
        if (command === "begin_search_session") return Promise.resolve(1);
        if (command === "plugin:event|listen") {
          listeners.set(args.event, [...(listeners.get(args.event) ?? []), args.handler]);
          return Promise.resolve(args.handler);
        }
        if (command === "plugin:event|unlisten" || command === "set_shortcut_recording") return Promise.resolve(null);
        if (command === "list_shortcuts") return Promise.resolve(copy());
        if (command === "save_shortcut_binding") {
          if (failSave) return Promise.reject(failSave);
          rows = rows.map((item) => item.id === args.id ? { ...item, saved: args.shortcut, active: args.shortcut, error: null } : item);
          return Promise.resolve(copy());
        }
        throw new Error(`测试收到意外命令：${command}`);
      },
    };
    const emit = (event, payload) => (listeners.get(event) ?? []).forEach((id) => callbacks.get(id)({ event, id: 0, payload }));

    const React = await import("react");
    const { createRoot } = await import("react-dom/client");
    const { ShortcutSettings } = await import("../src/features/shortcuts/ShortcutSettings.tsx");
    createRoot(document.getElementById("root")).render(React.createElement(ShortcutSettings));

    const pause = () => new Promise((resolve) => setTimeout(resolve, 10));
    async function until(check, message) {
      const deadline = Date.now() + 3000;
      while (!check()) { if (Date.now() > deadline) throw new Error(message); await pause(); }
    }
    function assert(value, message) { if (!value) throw new Error(message); }
    const rowOf = (label) => document.querySelector(`[aria-label="${label}快捷键"]`)?.closest(".shortcut-row");
    const input = (label) => rowOf(label).querySelector("input");
    const status = (label) => rowOf(label).querySelector(".shortcut-status").textContent;
    const keys = (label) => [...rowOf(label).querySelectorAll("kbd")].map((item) => item.textContent).join("");
    const button = (label, text) => [...rowOf(label).querySelectorAll("button")].find((item) => item.textContent.startsWith(text));
    const press = (label, code, modifiers = {}, key = code) => input(label).dispatchEvent(new KeyboardEvent("keydown", { key, code, bubbles: true, cancelable: true, ...modifiers }));
    const recordingCalls = () => calls.filter((call) => call.command === "set_shortcut_recording").map((call) => call.args.recording);

    const result = { passed: 0, total: 13, failures: [] };
    const scenarios = [
      ["按插件分组列出全部命令", async () => {
        await until(() => rowOf("二维码"), "未列出快捷键");
        const groups = [...document.querySelectorAll(".shortcut-group h3")].map((item) => item.textContent);
        assert(groups.join("|") === "常用操作|插件快捷键", `分组不正确：${groups.join("|")}`);
        assert(document.querySelector('.shortcut-featured input[aria-label="唤起轻匣快捷键"]'), "唤起快捷键应单独突出显示");
        assert(rowOf("编码工具 · 哈希").querySelector(".shortcut-title").textContent === "哈希", "子命令不应重复插件名称");
        assert(rowOf("剪贴板").querySelector(".shortcut-title").textContent === "剪贴板", "单命令插件只显示插件名");
        const right = [...document.querySelectorAll('.shortcut-group .shortcut-field')].map((item) => Math.round(item.getBoundingClientRect().right));
        assert(new Set(right).size === 1, `各行键帽应右对齐：${right.join(",")}`);
        assert(document.querySelectorAll(".shortcut-row").length === 9, "全部快捷键应保留，子命令分行列出");
        assert(rowOf("编码工具 · 哈希"), "多命令插件的行名称应带命令标题");
        assert(rowOf("插件全屏").textContent.includes("面板内"), "全屏应标注只在面板内生效");
      }],
      ["各行状态与可用操作", async () => {
        assert(input("二维码").disabled && status("二维码") === "插件已停用，未生效", "停用插件应不可编辑并标注未生效");
        assert(status("编码工具 · 哈希").includes("注册失败"), "注册失败原因应显示在该行");
        assert(!document.querySelector('[aria-haspopup="menu"], [role="menu"]'), "快捷键设置不应再显示三点菜单");
        assert(button("插件全屏", "恢复默认"), "与默认值不同时应直接提供恢复默认");
        assert(!button("唤起轻匣", "恢复默认") && !button("唤起轻匣", "清除"), "默认值未改动时不提供恢复默认，唤起不能清除");
        assert(!button("剪贴板", "建议"), "已保存值与建议值顺序不同但组合相同，不应再提示建议");
        assert(button("格式化编辑器", "建议")?.textContent === "建议 ⌥J", "应直接显示插件建议的快捷键");
        assert(button("截图", "建议")?.textContent === "建议 ⌥⇧A", "已有自定义值时仍应直接显示建议");
        assert(!button("剪贴板", "清除"), "不应再提供单独的清除按钮");
        assert(keys("剪贴板") === "⌥⇧V", `键帽应按规范顺序显示：${keys("剪贴板")}`);
      }],
      ["录入提示位于快捷键框内，聚焦和输入都不增加行高", async () => {
        const row = rowOf("截图");
        const before = row.getBoundingClientRect().height;
        input("截图").focus();
        await until(() => row.querySelector('.shortcut-field.recording'), "未进入录制状态");
        assert(row.querySelector('.shortcut-field-keys').textContent === "按下组合键", "录入提示应放在快捷键框内");
        assert(!status("截图") && row.getBoundingClientRect().height === before, "聚焦时不应新增下面的提示或改变行高");
        press("截图", "KeyB", { altKey: true }, "∫");
        await until(() => button("截图", "保存"), "未生成快捷键草稿");
        assert(keys("截图") === "⌥B" && !status("截图") && row.getBoundingClientRect().height === before, "录入后应显示键帽，不能在下面增加操作提示");
        press("截图", "Escape", {}, "Escape");
        await until(() => keys("截图") === "⌘⇧X", "取消录制后未恢复原组合键");
      }],
      ["录制时通知宿主并识别顺序不同的重复组合", async () => {
        input("格式化编辑器").focus();
        await until(() => recordingCalls().at(-1) === true, "聚焦后应通知宿主开始录制");
        press("格式化编辑器", "KeyV", { altKey: true, shiftKey: true }, "◊");
        await until(() => status("格式化编辑器") === "已被「剪贴板」使用", `未识别重复组合：${status("格式化编辑器")}`);
        assert(button("格式化编辑器", "保存").disabled, "组合重复时不能保存");
        input("格式化编辑器").blur();
        await until(() => recordingCalls().at(-1) === false, "失焦后应通知宿主结束录制");
        button("格式化编辑器", "取消").click();
        await until(() => !button("格式化编辑器", "保存"), "取消后应丢弃草稿");
      }],
      ["录制已注册的全局组合由宿主回报", async () => {
        input("格式化编辑器").focus();
        await pause();
        emit("shortcut-recorded", "Alt+Space");
        await until(() => status("格式化编辑器") === "已被「唤起轻匣」使用", `未处理宿主回报的组合：${status("格式化编辑器")}`);
        press("格式化编辑器", "Escape", {}, "Escape");
        await until(() => !button("格式化编辑器", "保存"), "Esc 应取消草稿");
      }],
      ["只按 ⇧ 时提示需要主要修饰键", async () => {
        input("格式化编辑器").focus();
        press("格式化编辑器", "KeyF", { shiftKey: true }, "F");
        await until(() => status("格式化编辑器").includes("需要包含"), "未提示需要 ⌘、⌃ 或 ⌥");
        assert(!button("格式化编辑器", "保存"), "无效组合不应产生草稿");
        input("格式化编辑器").blur();
      }],
      ["保存后按宿主返回刷新该行", async () => {
        input("格式化编辑器").focus();
        press("格式化编辑器", "KeyJ", { altKey: true }, "∆");
        await until(() => button("格式化编辑器", "保存") && !button("格式化编辑器", "保存").disabled, "有效组合应可保存");
        const before = rowOf("格式化编辑器").getBoundingClientRect().height;
        button("格式化编辑器", "保存").click();
        await until(() => status("格式化编辑器") === "已保存", "保存后应提示已保存");
        assert(rowOf("格式化编辑器").getBoundingClientRect().height === before, "保存成功提示也不应增加行高");
        const request = calls.findLast((call) => call.command === "save_shortcut_binding");
        assert(request.args.id === "json-tools:open" && request.args.shortcut === "Alt+J", `保存参数不正确：${JSON.stringify(request.args)}`);
        assert(keys("格式化编辑器") === "⌥J" && !button("格式化编辑器", "建议"), "保存后应显示新值，建议与已保存值相同时不再提示");
      }],
      ["保存失败在该行显示原因", async () => {
        failSave = "快捷键注册失败：测试占用";
        input("编码工具 · 编码 / 解码").focus();
        press("编码工具 · 编码 / 解码", "KeyE", { ctrlKey: true, altKey: true }, "´");
        await until(() => button("编码工具 · 编码 / 解码", "保存"), "未产生草稿");
        button("编码工具 · 编码 / 解码", "保存").click();
        await until(() => status("编码工具 · 编码 / 解码") === "快捷键注册失败：测试占用", "失败原因应显示在该行");
        assert(button("编码工具 · 编码 / 解码", "保存") && !button("编码工具 · 编码 / 解码", "保存").disabled, "失败后保留草稿以便重试");
        failSave = null;
        button("编码工具 · 编码 / 解码", "取消").click();
      }],
      ["退格清除插件快捷键，保存后生效", async () => {
        const before = calls.filter((call) => call.command === "save_shortcut_binding").length;
        input("剪贴板").focus();
        press("剪贴板", "Backspace", {}, "Backspace");
        await until(() => button("剪贴板", "保存"), "退格未产生清除草稿");
        assert(!keys("剪贴板") && calls.filter((call) => call.command === "save_shortcut_binding").length === before, "退格应先清空草稿，不能立即改动系统绑定");
        button("剪贴板", "保存").click();
        await until(() => status("剪贴板") === "已清除", "清除后应提示");
        const request = calls.findLast((call) => call.command === "save_shortcut_binding");
        assert(request.args.id === "clipboard-history:open" && request.args.shortcut === null, "清除应传 null");
        assert(rowOf("剪贴板").textContent.includes("未设置"), "清除后应显示未设置");
      }],
      ["其他入口修改后自动刷新", async () => {
        rows = rows.map((item) => item.id === "json-tools:open" ? { ...item, saved: "Alt+K", active: "Alt+K" } : item);
        emit("shortcuts-changed");
        await until(() => keys("格式化编辑器") === "⌥K", "收到变更通知后应重新读取");
      }],
      ["折叠插件命令时结束录制，重新展开保留草稿", async () => {
        const group = rowOf("编码工具 · 编码 / 解码").closest("details");
        assert(group?.open, "多命令插件应默认展开");
        input("编码工具 · 编码 / 解码").focus();
        press("编码工具 · 编码 / 解码", "KeyB", { altKey: true }, "∫");
        await until(() => button("编码工具 · 编码 / 解码", "保存"), "未产生草稿");
        group.querySelector("summary").click();
        await until(() => !group.open && recordingCalls().at(-1) === false, "折叠隐藏的录制框必须结束宿主录制");
        assert(group.getBoundingClientRect().height <= group.querySelector("summary").getBoundingClientRect().height + 1, "折叠后子命令仍占据空间");
        group.querySelector("summary").click();
        await until(() => group.open, "未重新展开");
        assert(keys("编码工具 · 编码 / 解码") === "⌥B", "折叠不能丢失未保存草稿");
        button("编码工具 · 编码 / 解码", "取消").click();
      }],
      ["建议值直接可见，点击后生成草稿且可以取消", async () => {
        const before = calls.filter((call) => call.command === "save_shortcut_binding").length;
        const suggestion = button("截图", "建议");
        assert(suggestion && suggestion.getBoundingClientRect().height > 0, "建议值必须直接可见");
        const hint = suggestion.getBoundingClientRect();
        const field = rowOf("截图").querySelector('.shortcut-field').getBoundingClientRect();
        assert(hint.right < field.left && Math.abs((hint.top + hint.bottom) / 2 - (field.top + field.bottom) / 2) < 1, "建议值应放在键帽左侧并在同一行居中");
        suggestion.click();
        await until(() => button("截图", "保存"), "选择建议未产生草稿");
        assert(keys("截图") === "⌥⇧A" && calls.filter((call) => call.command === "save_shortcut_binding").length === before, "选择建议不应立即修改系统绑定");
        button("截图", "取消").click();
        await until(() => keys("截图") === "⌘⇧X" && button("截图", "建议"), "取消建议后没有恢复原值");
      }],
      ["行内恢复默认仍需确认保存", async () => {
        const before = calls.filter((call) => call.command === "save_shortcut_binding").length;
        button("插件全屏", "恢复默认").click();
        await until(() => button("插件全屏", "保存"), "恢复默认未进入待保存状态");
        assert(keys("插件全屏") === "⌘⌃F" && !document.querySelector('[role="menu"]'), "默认键帽或菜单关闭状态不正确");
        assert(calls.filter((call) => call.command === "save_shortcut_binding").length === before, "选择默认值不应立即改动系统绑定");
        button("插件全屏", "取消").click();
      }],
    ];
    for (const [scenario, run] of scenarios) {
      try { await run(); result.passed++; } catch (error) { result.failures.push({ scenario, message: error.message }); }
    }
    const output = document.createElement("pre");
    output.id = "result";
    output.textContent = JSON.stringify(result);
    document.body.append(output);
  </script>
</body>
</html>
