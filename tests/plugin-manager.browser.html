<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><link rel="icon" href="data:,"><title>插件移除回归检查</title></head>
<body style="margin:0;width:720px">
  <div id="root"></div>
  <script type="module">
    import React from "react";
    import { createRoot } from "react-dom/client";
    import { PluginManager } from "../src/features/plugins/PluginManager.tsx";

    let plugins = [
      { id: "crypto-tools", name: "编码工具", source: "local" },
      { id: "json-tools", name: "JSON 编辑器", source: "bundled" },
    ].map((item) => ({ ...item, version: "0.1.1", enabled: true, error: null, icon: null, commands: [{ id: `${item.id}:open`, title: item.name }] }));
    const calls = [];
    let fail = false;
    let finish;
    globalThis.isTauri = true;
    window.__TAURI_INTERNALS__ = { invoke(command, args) {
      calls.push({ command, args });
      if (command === "list_plugins") return Promise.resolve(plugins);
      if (command === "import_plugin") {
        const imported = { ...plugins[0], id: "new-local", name: "新本地插件", source: "local", commands: [{ id: "new-local:open", title: "打开" }] };
        plugins = [imported, ...plugins];
        return Promise.resolve(plugins);
      }
      if (command === "remove_plugin") {
        if (fail) return Promise.reject("测试移除失败");
        return new Promise((resolve) => { finish = () => { plugins = plugins.filter((item) => item.id !== args.id); resolve(plugins); }; });
      }
      throw new Error(`测试收到意外命令：${command}`);
    } };
    createRoot(document.getElementById("root")).render(React.createElement(PluginManager));
    const pause = () => new Promise((resolve) => setTimeout(resolve, 10));
    async function until(check, message) {
      const deadline = Date.now() + 3000;
      while (!check()) { if (Date.now() > deadline) throw new Error(message); await pause(); }
    }
    function assert(value, message) { if (!value) throw new Error(message); }
    const remove = () => document.querySelector('[aria-label="移除编码工具"]');
    const confirm = () => [...document.querySelectorAll("button")].find((button) => button.textContent === "确认移除");
    const result = { passed: 0, total: 6, failures: [] };
    const scenarios = [
      ["内置和本地插件分组显示，内置组在前", async () => {
        await until(remove, "插件未加载");
        const groups = [...document.querySelectorAll('.plugin-manager-group')];
        assert(groups.map((group) => group.getAttribute("aria-label")).join("|") === "内置插件|本地插件", "分组名称或顺序不正确");
        assert(groups[0].querySelector("strong")?.textContent === "JSON 编辑器" && groups[1].querySelector("strong")?.textContent === "编码工具", "插件应按来源归入对应分组");
        assert(groups.every((group) => group.querySelectorAll('.plugin-manager-item').length === 1), "插件不应遗漏或重复");
      }],
      ["仅本地插件显示红色移除按钮", async () => {
        await until(remove, "本地插件缺少移除按钮");
        assert(!document.querySelector('[aria-label="移除JSON 编辑器"]'), "内置插件不应显示移除按钮");
        assert(getComputedStyle(remove()).color === "rgb(180, 35, 50)", "移除按钮应使用红色");
        const opens = [...document.querySelectorAll(".plugin-manager-open")].map((item) => Math.round(item.getBoundingClientRect().left));
        const switches = [...document.querySelectorAll(".plugin-manager-switch")].map((item) => Math.round(item.getBoundingClientRect().left));
        assert(new Set(opens).size === 1 && new Set(switches).size === 1, `内置与本地插件的按钮应对齐：${opens.join(",")} / ${switches.join(",")}`);
      }],
      ["取消确认不会执行移除", async () => {
        remove().click();
        await until(confirm, "未显示确认入口");
        [...document.querySelectorAll("button")].find((button) => button.textContent === "取消").click();
        await until(() => !confirm(), "未关闭确认入口");
        assert(!calls.some((call) => call.command === "remove_plugin"), "取消不应发起移除");
      }],
      ["移除失败保留列表并允许重试", async () => {
        fail = true;
        remove().click();
        await until(confirm, "未显示确认入口");
        confirm().click();
        await until(() => document.querySelector('[role="alert"]')?.textContent.includes("测试移除失败"), "失败未提示原因");
        assert(remove() && !remove().disabled, "失败后应保留插件并允许重试");
        assert(document.querySelector('[role="alert"]').closest(".plugin-manager-item") === remove().closest(".plugin-manager-item"), "错误必须位于出错的插件下面");
        assert(!document.querySelector(".plugin-manager > [role='alert']"), "单个插件错误不应出现在列表顶部");
      }],
      ["确认后防止重复操作并刷新插件列表", async () => {
        fail = false;
        confirm().click();
        await until(() => finish && confirm().disabled, "操作期间应禁用按钮");
        assert(document.querySelector('[role="status"]').closest(".plugin-manager-item") === remove().closest(".plugin-manager-item"), "进度提示必须位于对应插件下面");
        const requests = calls.filter((call) => call.command === "remove_plugin");
        assert(requests.length === 2 && requests[1].args.id === "crypto-tools", "应仅按插件标识发起移除");
        finish();
        await until(() => !remove(), "成功后未从列表移除");
        assert(document.querySelectorAll(".plugin-manager-item").length === 1, "应保留内置插件");
        assert(!confirm(), "成功后应关闭确认入口");
        const local = document.querySelector('[aria-label="本地插件"]');
        assert(local && local.textContent.includes("还没有本地插件"), "最后一个本地插件移除后应显示组内空状态");
      }],
      ["导入后自动归入本地插件组", async () => {
        document.querySelector('.plugin-manager-import').click();
        await until(() => document.querySelector('[aria-label="移除新本地插件"]'), "导入的插件未显示");
        const local = document.querySelector('[aria-label="本地插件"]');
        assert(local.querySelector('strong')?.textContent === "新本地插件", "导入插件没有归入本地组");
        assert(!local.querySelector('.plugin-manager-empty'), "导入后应移除本地组空状态");
        assert(document.querySelector('[aria-label="内置插件"] strong')?.textContent === "JSON 编辑器", "导入不应改变内置组");
      }],
    ];
    for (const [scenario, run] of scenarios) {
      try { await run(); result.passed++; } catch (error) { result.failures.push({ scenario, message: error.message }); }
    }
    const output = document.createElement("pre");
    output.id = "result";
    output.textContent = JSON.stringify(result);
    document.body.append(output);
  </script>
</body>
</html>
